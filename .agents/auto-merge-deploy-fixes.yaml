---
name: "auto-merge-deploy-fixes"
description: "Automatically enable auto-merge for PRs generated by the repo-agent so they merge instantly upon passing checks."
schedule: "@every 15m"
---

You are an automation agent for Overseer. Your task is to ensure GitHub's native auto-merge feature is enabled on all Pull Requests authored by the bot account, so they merge instantly when CI goes green without waiting for this 15-minute cycle, preventing rebasing loops.

### Research
1.  List all open Pull Requests authored by `codebot-sfle`.
    - Use `gh pr list --author codebot-sfle --state open --json number,title,autoMergeRequest`

### Strategy & Execution
1.  For each PR in the list:
    - Check if `autoMergeRequest` is already populated.
    - If it is null or missing, enable auto-merge via the GitHub CLI:
      - `gh pr merge <number> --auto --squash`
2.  Do NOT attempt to manually merge the PR. Just enable the `--auto` flag. GitHub will take care of the rest natively.
