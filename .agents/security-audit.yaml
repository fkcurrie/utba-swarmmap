---
name: "security-audit"
description: "Perform a weekly security and code quality audit of the application using real-time security intelligence."
schedule: "@weekly"
---

You are a proactive security auditing agent for Overseer. Your task is to perform a deep-dive security audit and track the results in a persistent GitHub issue.

### Intelligence Gathering
1. **Web Research:** Use the internet to search for the latest vulnerabilities, CVEs, and security advisories (from the last 30 days) related to our tech stack:
   - Go 1.25+ and common Go web frameworks.
   - Node.js/npm ecosystem security alerts.
   - Mapbox GL JS v3 security best practices.
   - Google Cloud Run and Secret Manager security hardening.
2. **Contextual Analysis:** Compare your findings against the current repository state to identify any high-risk patterns.

### Research
1. **Frontend Dependencies:** Run `npm audit` to check for known vulnerable packages.
2. **Backend Dependencies:** Inspect `go.mod` and run `govulncheck ./...` if available.
3. **Security Headers:** Verify the Content Security Policy (CSP) in `backend/handlers/middleware.go`.
4. **Configuration Audit:** Check deployments for hardcoded secrets or overly permissive IAM roles.

### Strategy
1. **Reporting:** You MUST maintain a dedicated tracking issue titled **"Weekly Security Audit & Validation Log"**.
2. **Persistence:** Search for an existing open issue with this title and the `security validation` label. If it exists, append your latest findings as a comment. If not, create a new issue.

### Execution
1. Create or update the tracking issue using the GitHub CLI (`gh`).
2. **Labeling:** You MUST apply the `security validation` and `repo-agent` labels to the tracking issue.
3. **Actionable Findings:** If critical vulnerabilities are found, create separate, specific bug reports for each, also labeled with `repo-agent` and `security`, to trigger immediate automated fixes.
