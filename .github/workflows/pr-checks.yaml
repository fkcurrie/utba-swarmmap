---
name: PR Checks

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

"on":
  push:
    branches: [main, issue-12-NPJh]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.mod

      - name: Go Format
        run: go fmt ./...

      - name: Go Vet
        run: go fmt ./... && go vet -v ./...

      - name: GolangCI-Lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: latest
          working-directory: backend
          only-new-issues: true
          install-mode: goinstall
          args: --verbose
      - name: Unit Tests
        run: go test -v ./...

      - name: Race Detector
        run: go test -race -v ./...

      - name: Test Coverage
        run: |
          go test -coverprofile=coverage.out ./...
          TOTAL_COVERAGE=$(go tool cover -func=coverage.out | grep total | awk '{print $3}' | sed 's/%//')
          echo "Total coverage: $TOTAL_COVERAGE%"
          if awk "BEGIN {exit !($TOTAL_COVERAGE < 25)}"; then
            echo "Coverage is below threshold (25%)"
            exit 1
          fi

      - name: Go Mod Tidy Check
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: Go Mod Verify
        run: go mod verify

      - name: Go Security (gosec)
        uses: securego/gosec@v2.25.0
        with:
          args: -exclude=G706 ./backend/...

      - name: Go Vulnerability Check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  frontend:
    name: Frontend (JS/HTML/CSS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: ESLint
        run: npx eslint "frontend/static/js/**/*.js"

      - name: Prettier
        run: npx prettier --check "frontend/static/**/*.{js,css}" "backend/templates/**/*.html"

      - name: HTMLHint
        run: npx htmlhint "backend/templates/**/*.html"

      - name: Stylelint
        run: npx stylelint "frontend/static/css/**/*.css"

      - name: Dependency Audit (npm audit)
        run: npm audit --audit-level=high

  frontend-go:
    name: Frontend (Go Server)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: frontend/go.mod
          cache-dependency-path: frontend/go.mod

      - name: Go Format
        run: go fmt main.go

      - name: Go Security (gosec)
        uses: securego/gosec@master
        with:
          args: -exclude=G706 ./frontend/...

      - name: Go Vulnerability Check (govulncheck)
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  general:
    name: General & Infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod

      - name: Install Dependencies
        run: npm ci

      - name: Secret Scanning (detect-secrets)
        uses: reviewdog/action-detect-secrets@v0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          detect_secrets_flags: "--exclude-files 'node_modules|package-lock.json'"

      - name: Actionlint
        uses: reviewdog/action-actionlint@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review

      - name: YAML Lint (yamllint)
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .yamllint.yaml

      - name: Markdown Lint
        run: npx markdownlint "**/*.md" --ignore node_modules

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@2.0.0
        with:
          ignore_paths: node_modules

      - name: Dockerfile Lint (hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          recursive: true

      - name: Misspell
        uses: reviewdog/action-misspell@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review

      - name: Commitlint
        uses: wagoid/commitlint-github-action@v6.2.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  e2e:
    name: End-to-End (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy Static Assets for Backend Build
        run: cp -r frontend/static backend/static

      - name: Build and Start Services
        run: docker compose up -d --build

      - name: Wait for Services
        run: |
          echo "Waiting for services to be healthy..."
          for i in {1..30}; do
            BACKEND_UP=false
            FRONTEND_UP=false
            if curl -s http://localhost:8085 > /dev/null; then
              BACKEND_UP=true
            fi
            if curl -s http://localhost:8082/static/css/style.css > /dev/null; then
              FRONTEND_UP=true
            fi

            if [ "$BACKEND_UP" = true ] && [ "$FRONTEND_UP" = true ]; then
              echo "All services are up!"
              exit 0
            fi
            echo "Waiting... Backend: $BACKEND_UP, Frontend: $FRONTEND_UP ($i/30)"
            sleep 2
          done
          echo "Services failed to start"
          docker compose logs
          exit 1

      - name: Run Playwright tests
        run: npx playwright test -c e2e/playwright.config.js
        env:
          DEPLOYED_URL: http://localhost:8085

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Cleanup
        if: always()
        run: docker compose down
