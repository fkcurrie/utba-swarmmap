---
extends: default

ignore:
  - 'node_modules/'
  - 'vendor/'
  - 'backend/vendor/'
  - '.git/'

rules:
  line-length:
    max: 160
    allow-non-breakable-words: true
  indentation:
    spaces: 2
  truthy:
    allowed-values: ['true', 'false', 'yes', 'no', 'on', 'off']
  document-start: disable
