version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - gosec
    - govet
    - ineffassign
    - misspell
    - revive
    - staticcheck
    - unused
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
      - path: third_party/.*
        linters:
          - all
      - path: builtin/.*
        linters:
          - all
      - path: examples/.*
        linters:
          - all

output:
  formats:
    text:
      path: stdout
      colors: true
      print-issued-lines: true
      print-linter-name: true
