---
# cloudbuild-backend.yaml
# Use this for backend deployments.
# Command: gcloud builds submit --config cloudbuild-backend.yaml .
steps:
  # Get the URL of the already-deployed frontend service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Get Frontend URL'
    entrypoint: 'bash'
    args:
      - '-c'
      - >
        gcloud run services describe utba-swarmmap-frontend
        --platform=managed
        --region=northamerica-northeast2
        --format='value(status.url)' --quiet > /workspace/frontend-url.txt
  # Build and deploy the backend service
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Build Backend'
    args:
      - 'build'
      - '-t'
      - 'northamerica-northeast2-docker.pkg.dev/$PROJECT_ID/swarmmap-repo/backend:latest'
      - '.'
  - name: 'gcr.io/cloud-builders/docker'
    id: 'Push Backend'
    args:
      - 'push'
      - 'northamerica-northeast2-docker.pkg.dev/$PROJECT_ID/swarmmap-repo/backend:latest'
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Deploy Backend'
    entrypoint: 'bash'
    args:
      - '-c'
      - >
        BACKEND_URL=$(gcloud run services describe utba-swarmmap-backend
        --platform=managed --region=northamerica-northeast2
        --format='value(status.url)' 2>/dev/null || echo "");

        if [ -z "$BACKEND_URL" ]; then
          PROJECT_NUMBER=$(gcloud projects describe $PROJECT_ID
          --format='value(projectNumber)');
          BACKEND_URL="https://utba-swarmmap-backend-${PROJECT_NUMBER}.northamerica-northeast2.run.app";
        fi;

        gcloud run deploy utba-swarmmap-backend
        --image=northamerica-northeast2-docker.pkg.dev/$PROJECT_ID/swarmmap-repo/backend:latest
        --region=northamerica-northeast2
        --platform=managed
        --allow-unauthenticated
        --port=8080
        --memory=512Mi
        --cpu=1
        --set-env-vars=FRONTEND_ASSETS_URL=$(cat /workspace/frontend-url.txt)
        --set-env-vars=GOOGLE_REDIRECT_URL=${BACKEND_URL}/auth/google/callback
        --update-secrets=GOOGLE_CLIENT_ID=google-oauth-client-id:latest
        --update-secrets=GOOGLE_CLIENT_SECRET=google-oauth-client-secret:latest
        --quiet
  # Get the URL of the deployed service and write it to a file
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Get Service URL'
    entrypoint: 'bash'
    args:
      - '-c'
      - >
        gcloud run services describe utba-swarmmap-backend
        --platform=managed --region=northamerica-northeast2
        --format='value(status.url)' --quiet > /workspace/service-url
  # Verify the deployment by curling the URL from the file with retries
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'Verify Deployment'
    entrypoint: 'bash'
    args:
      - '-c'
      - 'curl --retry 5 --retry-all-errors --retry-delay 5 -I --fail --silent --show-error "$(cat /workspace/service-url)"'
images:
  - 'northamerica-northeast2-docker.pkg.dev/$PROJECT_ID/swarmmap-repo/backend:latest'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'E2_HIGHCPU_8' # Use a faster machine for building
