    </main> <!-- closes main-content -->
    <footer class="footer py-4" role="contentinfo">
        <div class="container-xl text-center">
            <p class="text-muted small mb-2">
                Made with 🐝❤️🐝 with <a href="https://github.com/google/gemini-cli" target="_blank" rel="noopener">gemini-cli</a>
            </p>
            <nav aria-label="Admin navigation">
                <p class="text-muted small mb-0">
                    {{if and .User (eq .User.Role "site_admin")}}
                        <a href="/admin" class="text-decoration-none">Site Administration</a>
                    {{else}}
                        <a href="/login?role=site_admin" class="text-decoration-none">Site Admin Login</a>
                    {{end}}
                </p>
            </nav>
        </div>
    </footer>

    <!-- Global Media Viewer Modal -->
    <div class="modal media-modal" id="media-viewer-modal" tabindex="-1" role="dialog">
        <div class="modal-dialog modal-xl modal-dialog-centered" role="document">
            <div class="modal-content overflow-hidden">
                <div class="modal-header border-0 bg-dark py-2">
                    <h5 class="modal-title visually-hidden">Media Viewer</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body p-0 bg-dark">
                    <div class="media-content">
                        <img id="media-viewer" src="" alt="Swarm report media" class="img-fluid" style="display: none;">
                        <video id="video-viewer" controls class="w-100" style="display: none;"></video>
                        
                        <button class="media-nav prev" aria-label="Previous media">
                            <i class="fa-solid fa-chevron-left"></i>
                        </button>
                        <button class="media-nav next" aria-label="Next media">
                            <i class="fa-solid fa-chevron-right"></i>
                        </button>
                    </div>
                    <div class="media-counter py-3 text-light small opacity-75" id="media-counter"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="/static/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>
    <script src="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.js"></script>
    <script src="/static/js/main.js"></script>
</body>
</html>
