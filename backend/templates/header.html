<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="UTBA Swarm Map - Help us track and save bee swarms in Toronto.">
    <title>{{.Title}} - UTBA Swarm Map</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{if .FrontendAssetsURL}}{{.FrontendAssetsURL}}{{end}}/static/vendor/bootstrap/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link href="https://api.mapbox.com/mapbox-gl-js/v3.2.0/mapbox-gl.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{if .FrontendAssetsURL}}{{.FrontendAssetsURL}}{{end}}/static/css/style.css">
    <script>
        window.MAPBOX_TOKEN = "{{.MapboxToken}}";
    </script>
</head>
<body>
    <header role="banner">
        <nav class="navbar navbar-expand-md navbar-light fixed-top" aria-label="Main Navigation">
            <div class="container-xl">
                <a class="navbar-brand" href="/">UTBA Swarm Map</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="fa-solid fa-bars"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto align-items-center">
                        {{if .User}}
                            <li class="nav-item">
                                <span class="nav-link disabled px-3">
                                    <i class="fa-solid fa-user-circle me-1"></i> {{.User.Username}}
                                </span>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link px-3" href="/dashboard">Dashboard</a>
                            </li>
                            <li class="nav-item ms-md-2">
                                <a class="btn btn-sm btn-outline-secondary" href="/logout">Logout</a>
                            </li>
                        {{else}}
                            <li class="nav-item">
                                <a class="nav-link px-3" href="/login">Swarm Collectors Login</a>
                            </li>
                        {{end}}
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="main-content" id="main-content">
