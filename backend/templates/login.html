{{template "header.html" .}}

<div class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>Swarm Collector Login</h4>
                </div>
                <div class="card-body">
                    {{if .Error}}
                    <div class="alert alert-danger">{{.Error}}</div>
                    {{end}}
                    
                    <form action="/auth/login" method="POST">
                        <div class="mb-3">
                            <label for="email">Email address</label>
                            <input type="email" class="form-control" id="email" name="email" required>
                        </div>
                        <div class="mb-3">
                            <label for="password">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <a href="/auth/forgot-password">Forgot Password?</a>
                    </div>
                    
                    <hr class="my-4">
                    
                    <div class="text-center">
                        <p class="mb-3">Or sign in with:</p>
                        <a href="/auth/google" class="google-signin-btn btn btn-outline-danger w-100">
                            Sign in with Google
                        </a>
                        <a href="/auth/apple" class="btn btn-outline-dark w-100 mt-2">
                            Sign in with Apple
                        </a>
                    </div>
                    
                    <hr class="my-4">
                    
                    <div class="text-center">
                        <p>New Collector? <a href="/register">Register here</a></p>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-3">
                <small class="text-muted">UTBA Swarm Map v{{.Version}}</small>
            </div>
        </div>
    </div>
</div>

{{template "footer.html" .}}
