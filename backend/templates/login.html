{{template "header.html" .}}

<div class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card border-0 shadow-lg" style="border-radius: var(--border-radius-lg);">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <h1 class="h3 fw-800 tracking-tight">Welcome Back</h1>
                        <p class="text-muted">Login to your collector account</p>
                    </div>

                    {{if .Error}}
                    <div class="alert alert-danger border-0 small" role="alert">
                        <i class="fa-solid fa-circle-exclamation me-2"></i> {{.Error}}
                    </div>
                    {{end}}
                    
                    <form action="/auth/login" method="POST" aria-label="Login Form">
                        <div class="mb-3">
                            <label for="email" class="form-label small fw-bold text-muted text-uppercase tracking-wider">Email address</label>
                            <input type="email" class="form-control bg-light border-0 p-3" id="email" name="email" required autocomplete="email" placeholder="email@example.com">
                        </div>
                        <div class="mb-4">
                            <label for="password" class="form-label small fw-bold text-muted text-uppercase tracking-wider">Password</label>
                            <input type="password" class="form-control bg-light border-0 p-3" id="password" name="password" required autocomplete="current-password" placeholder="••••••••">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-3 shadow-sm mb-3">Sign In</button>
                    </form>
                    
                    <div class="text-center">
                        <a href="/auth/forgot-password" class="small text-decoration-none text-muted">Forgot Password?</a>
                    </div>
                    
                    <div class="position-relative my-4">
                        <hr>
                        <span class="position-absolute top-50 start-50 translate-middle bg-white px-3 small text-muted">or continue with</span>
                    </div>
                    
                    <div class="d-grid gap-2">
                        <a href="/auth/google" class="btn btn-outline-light border text-dark py-2 small shadow-sm" aria-label="Sign in with Google">
                            <i class="fa-brands fa-google me-2 text-danger"></i> Google
                        </a>
                        <a href="/auth/apple" class="btn btn-outline-light border text-dark py-2 small shadow-sm" aria-label="Sign in with Apple">
                            <i class="fa-brands fa-apple me-2"></i> Apple
                        </a>
                    </div>
                    
                    <div class="text-center mt-5">
                        <p class="small text-muted mb-0">New Collector? <a href="/register" class="fw-bold text-primary text-decoration-none">Create an account</a></p>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-4">
                <small class="text-muted opacity-50">UTBA Swarm Map v{{.Version}}</small>
            </div>
        </div>
    </div>
</div>

{{template "footer.html" .}}
