{{template "header.html" .}}

<div class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>Swarm Collector Login</h4>
                </div>
                <div class="card-body">
                    {{if .Error}}
                    <div class="alert alert-danger" role="alert">
                        <i class="fa-solid fa-exclamation-circle me-2"></i> {{.Error}}
                    </div>
                    {{end}}
                    
                    <form action="/auth/login" method="POST" aria-label="Login Form">
                        <div class="mb-3">
                            <label for="email" class="fw-bold">Email address</label>
                            <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label for="password" class="fw-bold">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required autocomplete="current-password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">Login</button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <a href="/auth/forgot-password">Forgot Password?</a>
                    </div>
                    
                    <hr class="my-4">
                    
                    <div class="text-center">
                        <p class="mb-3 fw-bold">Or sign in with:</p>
                        <a href="/auth/google" class="google-signin-btn btn btn-outline-danger w-100 shadow-sm" aria-label="Sign in with Google">
                            <i class="fa-brands fa-google me-2"></i> Sign in with Google
                        </a>
                        <a href="/auth/apple" class="btn btn-outline-dark w-100 mt-2 shadow-sm" aria-label="Sign in with Apple">
                            <i class="fa-brands fa-apple me-2"></i> Sign in with Apple
                        </a>
                    </div>
                    
                    <hr class="my-4">
                    
                    <div class="text-center">
                        <p>New Collector? <a href="/register">Register here</a></p>
                    </div>
                </div>
            </div>
            
            <div class="text-center mt-3">
                <small class="text-muted">UTBA Swarm Map v{{.Version}}</small>
            </div>
        </div>
    </div>
</div>

{{template "footer.html" .}}
