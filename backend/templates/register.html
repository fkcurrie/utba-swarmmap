{{template "header.html" .}}

<div class="container mt-5 pt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header">
                    <h4>Register as Swarm Collector</h4>
                </div>
                <div class="card-body">
                    {{if .Error}}
                    <div class="alert alert-danger" role="alert">
                        <i class="fas fa-exclamation-circle mr-2"></i> {{.Error}}
                    </div>
                    {{end}}
                    
                    <form action="/auth/register" method="POST" aria-label="Registration Form">
                        <div class="mb-3">
                            <label for="name" class="fw-bold">Full Name</label>
                            <input type="text" class="form-control" id="name" name="name" required autocomplete="name">
                        </div>
                        <div class="mb-3">
                            <label for="email" class="fw-bold">Email address</label>
                            <input type="email" class="form-control" id="email" name="email" required autocomplete="email">
                        </div>
                        <div class="mb-3">
                            <label for="phone" class="fw-bold">Phone Number</label>
                            <input type="tel" class="form-control" id="phone" name="phone" required autocomplete="tel">
                        </div>
                        <div class="mb-3">
                            <label for="location" class="fw-bold">General Location</label>
                            <input type="text" class="form-control" id="location" name="location" placeholder="e.g. South London, Croydon" required>
                        </div>
                        <div class="mb-3">
                            <label for="password" class="fw-bold">Password</label>
                            <input type="password" class="form-control" id="password" name="password" required minlength="8" autocomplete="new-password">
                            <small class="form-text text-muted">Must be at least 8 characters long.</small>
                        </div>
                        <button type="submit" class="btn btn-primary w-100 fw-bold shadow-sm">Register</button>
                    </form>
                    
                    <div class="text-center mt-3">
                        <p>Already have an account? <a href="/login">Login here</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

{{template "footer.html" .}}
