---
name: Deploy to Cloud Run

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

env:
  PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
  REGION: northamerica-northeast2
  SERVICE: utba-swarmmap-backend
  REPO: swarmmap-repo

jobs:
  deploy:
    name: Validate, Build, and Deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Linting
        run: |
          npx eslint "frontend/static/js/**/*.js"
          npx markdownlint "**/*.md" --ignore node_modules

      - name: YAML Lint
        uses: ibiqlik/action-yamllint@v3
        with:
          file_or_dir: .
          config_file: .yamllint.yaml

      - name: Commitlint
        uses: wagoid/commitlint-github-action@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: backend/go.mod

      - name: Backend Testing
        run: |
          cd backend
          go test -v ./...

      - name: Docker Build Test
        run: |
          docker build -t test-backend ./backend

      - name: Google Auth
        id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: |
          gcloud auth configure-docker ${{ env.REGION }}-docker.pkg.dev --quiet

      - name: Get Frontend URL
        id: frontend-url
        run: |
          URL=$(gcloud run services describe utba-swarmmap-frontend \
            --platform=managed \
            --region=${{ env.REGION }} \
            --format='value(status.url)' || echo "")
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Get Backend URL
        id: backend-url
        run: |
          URL=$(gcloud run services describe ${{ env.SERVICE }} \
            --platform=managed \
            --region=${{ env.REGION }} \
            --format='value(status.url)' 2>/dev/null || echo "")
          if [ -z "$URL" ]; then
            PROJECT_NUMBER=$(gcloud projects describe ${{ env.PROJECT_ID }} --format='value(projectNumber)')
            URL="https://${{ env.SERVICE }}-${PROJECT_NUMBER}.${{ env.REGION }}.run.app"
          fi
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Build and Push Container
        run: |
          IMAGE_NAME="${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/backend"
          docker build -t "$IMAGE_NAME:${{ github.sha }}" ./backend
          docker tag "$IMAGE_NAME:${{ github.sha }}" "$IMAGE_NAME:latest"
          docker push "$IMAGE_NAME:${{ github.sha }}"
          docker push "$IMAGE_NAME:latest"

      - name: Deploy to Cloud Run
        id: deploy
        uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: ${{ env.SERVICE }}
          region: ${{ env.REGION }}
          image: ${{ env.REGION }}-docker.pkg.dev/${{ env.PROJECT_ID }}/${{ env.REPO }}/backend:${{ github.sha }}
          env_vars: |
            FRONTEND_ASSETS_URL=${{ steps.frontend-url.outputs.url }}
            GOOGLE_REDIRECT_URL=${{ steps.backend-url.outputs.url }}/auth/google/callback
          secrets: |
            GOOGLE_CLIENT_ID=google-oauth-client-id:latest
            GOOGLE_CLIENT_SECRET=google-oauth-client-secret:latest

      - name: Health Check
        run: |
          curl --retry 5 --retry-all-errors --retry-delay 5 -I --fail --silent --show-error "${{ steps.deploy.outputs.url }}"
