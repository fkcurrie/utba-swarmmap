---
services:
  firestore-emulator:
    image: gcr.io/google.com/cloudsdktool/cloud-sdk:emulators
    command: gcloud beta emulators firestore start --host-port=0.0.0.0:8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD-SHELL", "curl -s http://localhost:8081 > /dev/null || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 20

  gcs-emulator:
    image: fsouza/fake-gcs-server
    command: -scheme http
    ports:
      - "4443:4443"
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "4443"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      - PORT=8080
      - GCP_PROJECT_ID=utba-swarmmap
      - GCS_BUCKET_NAME=utba-swarmmap-media
      - FIRESTORE_EMULATOR_HOST=firestore-emulator:8081
      - STORAGE_EMULATOR_HOST=gcs-emulator:4443
      - GOOGLE_CLIENT_ID=fake-id
      - GOOGLE_CLIENT_SECRET=fake-secret
      - GOOGLE_REDIRECT_URL=http://localhost:8080/auth/google/callback
    ports:
      - "8080:8080"
    depends_on:
      firestore-emulator:
        condition: service_healthy
      gcs-emulator:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    environment:
      - PORT=8082
    ports:
      - "8082:8082"
